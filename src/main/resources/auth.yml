# ==============================================================================
# 💎 SmartLogin — Authentication & Proxy Hub Redirection
# ==============================================================================

# Password Hashing Engine ("FAST_PBKDF2" or "SECURE_PBKDF2")
hashing:
  mode: "FAST_PBKDF2"
  salt-bytes: 32

# SessionShield: Skip login if reconnecting from the same IP
session-shield:
  enabled: true
  session-duration-minutes: 60

# Bedrock / Floodgate auto-login
bedrock:
  auto-login-enabled: true

# Java Premium Mojang Auto-Login
premium:
  auto-login-enabled: true

# Multi-Server / Proxy Support (Velocity & BungeeCord)
proxy:
  enabled: false
  # Automatically send player to a lobby or game server upon successful login
  send-to-server-on-login: ""
  # Example: send-to-server-on-login: "lobby-1"
