#  📍 AUTHENTICATION SPAWN & LIMBO
# ==============================================================================
auth-spawn:
  # Teleports unauthenticated players to a dedicated authentication hub or spawn point.
  enabled: false

  # Target world for the auth spawn.
  world: "world"

  # Coordinates and rotation for the auth spawn point.
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

  # Teleports player back to their original disconnection location upon successful login.
  teleport-back-on-login: true

# ==============================================================================
#   ____  _                                    
#  / ___|| |_ _ __ ___  __ _ _ __ ___   ___ _ __ 
#  \___ \| __| '__/ _ \/ _` | '_ ` _ \ / _ \ '__|
#   ___) | |_| | |  __/ (_| | | | | | |  __/ |   
#  |____/ \__|_|  \___|\__,_|_| |_| |_|\___|_|   
#
#  🎥 STREAMER & CONTENT CREATOR SHIELD (/streamer)
# ==============================================================================
streamer-protection:
  # Enables the streamer mode security engine.
  enabled: true

  # Automatically masks real IP addresses in GUIs and commands (***.***.***.***).
  mask-ips: true

  # Automatically masks email addresses (u***@domain.com) and Discord IDs in GUIs.
  mask-emails-and-ids: true

  # Intercepts and deletes accidental chat leaks of passwords without leading slashes.
  anti-chat-password-leak: true

  # Plays an alert sound and sends a private warning when a leak is intercepted.
  alert-on-intercepted-leak: true

  # Warns streamers in chat before generating and holding a QR map with /2fa setup.
  warn-on-2fa-qr-setup: true
