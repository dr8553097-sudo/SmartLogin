prefix: "<gradient:#9d4edd:#00f0ff><bold>SmartLogin</bold></gradient> <dark_gray>»</dark_gray> "

login_prompt: "<yellow>Please log in using <gold>/login <password></gold> or open the PIN pad.</yellow>"
register_prompt: "<yellow>Please register using <gold>/register <password> <confirm></gold>.</yellow>"
login_success: "<green>✔ Welcome back, <white>{player}</white>! Authentication successful.</green>"
register_success: "<green>✔ Account successfully registered! Welcome to the server.</green>"
already_logged_in: "<red>You are already authenticated!</red>"
wrong_password: "<red>✘ Incorrect password! Remaining attempts: <yellow>{attempts}</yellow></red>"
password_too_short: "<red>✘ Password too short! Minimum length is <yellow>{min}</yellow> characters.</red>"
password_blocked: "<red>✘ That password is too common or insecure! Please choose a safer one.</red>"
passwords_dont_match: "<red>✘ Passwords do not match! Please check your typing.</red>"
max_accounts_reached: "<red>✘ Maximum number of accounts per IP address reached (<yellow>{max}</yellow>).</red>"
timeout_kick: "<red>You took too long to authenticate! Please log in faster next time.</red>"
password_changed: "<green>✔ Password successfully updated!</green>"

two_factor_prompt: "<aqua>🔐 This account is protected by 2FA! Please enter your 6-digit code with <gold>/2fa verify <code></gold>.</aqua>"
two_factor_success: "<green>✔ 2FA Verification successful! Access granted.</green>"
two_factor_invalid: "<red>✘ Invalid 2FA code! Please check your authenticator app.</red>"
two_factor_map_given: "<aqua>🗺️ A QR Code Map has been placed in your hand! Scan it with Google Authenticator or Authy, then type <gold>/2fa verify <code></gold>.</aqua>"
two_factor_secret_chat: "<gray>Manual Secret (if unable to scan): <gold><underlined>{secret}</underlined></gold></gray>"
two_factor_disabled: "<yellow>2FA has been disabled for your account.</yellow>"
two_factor_already_enabled: "<red>2FA is already enabled on your account!</red>"
two_factor_not_enabled: "<red>2FA is not enabled on your account.</red>"
backup_codes_generated: "<green>✔ Save these 5 single-use backup codes in a safe place:\n<gold>{codes}</gold></green>"

tri_mode_premium: "<green>⚡ Official Mojang account detected! Logged in automatically.</green>"
tri_mode_bedrock: "<green>⚡ Bedrock / Xbox account detected! Logged in automatically.</green>"

pin_pad_title: "<dark_purple><bold>Enter Security PIN</bold></dark_purple>"
pin_pad_button_clear: "<red><bold>✖ Clear PIN</bold></red>"
pin_pad_button_confirm: "<green><bold>✔ Confirm PIN</bold></green>"

admin_reload: "<green>✔ SmartLogin configurations and language files reloaded!</green>"
admin_unregistered: "<green>✔ Successfully unregistered player <white>{player}</white>.</green>"
admin_reset_2fa: "<green>✔ Successfully reset 2FA for player <white>{player}</white>.</green>"
player_not_found: "<red>Player not found in database.</red>"
no_permission: "<red>You don't have permission to use this command.</red>"
