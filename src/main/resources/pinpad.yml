# ==============================================================================
# 🔢 SmartLogin — Virtual PIN Pad GUI (Anti-Streamer & Anti-Keylogger)
# ==============================================================================

# Enable / Disable virtual PIN Pad inventory GUI
enabled: true

# Randomize number layout every time GUI opens (prevents click recording / macro bots)
randomize-positions: true

# Auto-open PIN Pad GUI for players upon joining instead of typing /login in chat
auto-open-on-join: false

# Enforce PIN Pad entry for staff members with permission 'smartlogin.staff'
enforce-for-staff: false
