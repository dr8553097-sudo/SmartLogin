# ==============================================================================
# 🛡️ SmartLogin — Core Configuration
# ==============================================================================

# Has the server initial setup wizard been completed?
# If false, the first admin/OP who joins will see the interactive setup wizard in chat.
setup-completed: false

# General settings
general:
  # Default fallback language if client locale is not detected or supported ('en', 'es', 'fr', 'pt')
  default-language: "es"
  # Automatically detect each player's Minecraft client language and translate all messages/GUI for them!
  auto-detect-client-language: true
  # Authentication timeout in seconds before kicking
  auth-timeout-seconds: 60
  # Maximum registered accounts allowed per IP address (0 for unlimited)
  max-accounts-per-ip: 3

# Password Security Policy
password-policy:
  min-length: 6
  max-length: 32
  # Enforce at least one number or special character
  require-complexity: false
  # Block commonly cracked passwords
  disallowed-passwords:
    - "123456"
    - "12345678"
    - "password"
    - "contrasena"
    - "admin"
    - "qwerty"
    - "minecraft"

# Visual Lockdown & Restrictions before login
lockdown:
  apply-blindness: true
  apply-slowness: true
  hide-other-players: true
  prevent-movement: true
  prevent-chat: true
  prevent-item-drop: true
  prevent-inventory-click: true
  prevent-damage: true
  # Allowed commands before login
  allowed-commands:
    - "/login"
    - "/l"
    - "/register"
    - "/reg"
    - "/2fa"
    - "/pinpad"

# Authentication Spawn & Limbo
auth-spawn:
  enabled: true
  # Set in-game using /smartlogin setspawn
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  # Return player to their previous logout location after login
  teleport-back-on-login: true
