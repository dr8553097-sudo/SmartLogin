# ==============================================================================
# 🛡️ SmartLogin — Core Configuration
# ==============================================================================

# Has the server initial setup wizard been completed?
# If false, the first admin/OP who joins will see the interactive setup wizard in chat.
setup-completed: false

# General settings
general:
  default-language: "es"
  # Automatically detect each player's Minecraft client language and translate all messages/GUI for them!
  auto-detect-client-language: true
  # Authentication timeout in seconds before kicking
  auth-timeout-seconds: 60
  # Maximum registered accounts allowed per IP address (0 for unlimited)
  max-accounts-per-ip: 3

# Anti-Impostor & Nickname Protection
nickname-protection:
  # Enforce exact case-sensitivity (e.g. Dafealru != dafealru) to prevent impersonation
  strict-case: true
  # Regex pattern for allowed characters in usernames
  allowed-regex: "^[a-zA-Z0-9_]{3,16}$"

# Password Security Policy
password-policy:
  min-length: 6
  max-length: 32
  # Max failed attempts before kicking player
  max-login-attempts: 5
  disallowed-passwords:
    - "123456"
    - "12345678"
    - "password"
    - "contrasena"
    - "admin"
    - "qwerty"
    - "minecraft"

# Visual HUD & Audio Immersion
hud-and-immersion:
  # Dynamic countdown BossBar (Green -> Yellow -> Red)
  bossbar-countdown: true
  bossbar-color: "GREEN"
  # Blinking Actionbar message
  actionbar-prompt: true
  # Sound effects on success, failure, 2fa
  play-sounds: true

# Visual Lockdown & Restrictions before login
lockdown:
  apply-blindness: true
  apply-slowness: true
  hide-unauthenticated-from-tab: true
  prevent-movement: true
  prevent-chat: true
  prevent-item-drop: true
  prevent-inventory-click: true
  prevent-damage: true
  allowed-commands:
    - "/login"
    - "/l"
    - "/register"
    - "/reg"
    - "/2fa"
    - "/pinpad"
    - "/link"
    - "/email"

# Authentication Spawn & Limbo
auth-spawn:
  enabled: true
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  teleport-back-on-login: true
