# Indicates whether the initial in-game setup wizard has been completed.
# If set to false, the first operator (OP) joining will be prompted with the interactive Setup Wizard GUI.
setup-completed: false

# ------------------------------------------------------------------------------
# ⚙️ GENERAL CONFIGURATION
# ------------------------------------------------------------------------------
general:
  # Default language for new players when joining the server.
  # Available languages: es (Spanish), en (English), pt (Portuguese), fr (French), de (German), ru (Russian), zh (Chinese).
  default-language: "es"

  # Automatically detect and apply the player's Minecraft client language.
  # When set to false or when an admin sets the language via '/smartlogin lang <lang>', explicit settings take precedence.
  auto-detect-client-language: true

  # Maximum duration in seconds a player has to register or log in before being kicked.
  auth-timeout-seconds: 60

  # Maximum number of registered accounts allowed per individual IP address.
  # Mitigates bot attacks and mass alt registration. Set to 0 to disable.
  max-accounts-per-ip: 10

  # List of usernames exempt from the IP account limit (bypass).
  ip-limit-bypass-users:
    - "Dafealru"
    - "xylos5"
    - "xylos5_alt"

  # List of IP addresses exempt from the IP account limit (bypass).
  ip-limit-bypass-ips:
    - "177.8.78.74"
    - "127.0.0.1"

# ------------------------------------------------------------------------------
# 👤 NICKNAME PROTECTION (ANTI-IMPOSTOR)
# ------------------------------------------------------------------------------
nickname-protection:
  # Enforces exact character case matching with the registered username.
  # Prevents impostors from joining with modified casing (e.g. 'dafealru' vs 'Dafealru').
  strict-case: true

  # Regular expression pattern defining valid username characters and length.
  allowed-regex: "^[a-zA-Z0-9_]{3,16}$"

# ------------------------------------------------------------------------------
# 🔑 PASSWORD POLICIES & BRUTE-FORCE PROTECTION
# ------------------------------------------------------------------------------
password-policy:
  # Minimum required length for passwords.
  min-length: 6

  # Maximum allowed length for passwords.
  max-length: 32

  # Maximum consecutive failed login attempts before kicking/blocking the player temporarily.
  max-login-attempts: 5

  # Blacklist of commonly used or insecure passwords disallowed during registration or password change.
  disallowed-passwords:
    - "123456"
    - "12345678"
    - "password"
    - "contrasena"
    - "admin"
    - "qwerty"
    - "minecraft"

# ------------------------------------------------------------------------------
# 🧩 DYNAMIC ANTI-BOT CAPTCHA SHIELD
# ------------------------------------------------------------------------------
captcha:
  # Opens an interactive graphical item-matching captcha after X failed password attempts (0 = disabled).
  trigger-after-failed-attempts: 2

  # Enforce solving a captcha before completing initial registration for new players.
  enforce-on-register: false

# ------------------------------------------------------------------------------
# 🔨 ANVIL GUI INPUT SYSTEM
# ------------------------------------------------------------------------------
anvil-gui:
  # Enables visual authentication via Anvil interfaces (/anvil login, /anvil register).
  enabled: true

  # Automatically opens the Anvil GUI upon player join instead of requiring chat input.
  auto-open-on-join: false

# ------------------------------------------------------------------------------
# 🌍 GEO-IP & IMPOSSIBLE TRAVEL SECURITY
# ------------------------------------------------------------------------------
geo-protection:
  # Enables geographic location and country detection for connecting players.
  enabled: true

  # Sends security alerts to staff and Discord if a player connects from an unexpected/new country.
  alert-on-country-change: true

  # Automatically requires 2-Factor Authentication (2FA) if an unexpected country change is detected.
  enforce-2fa-on-country-change: true

# ------------------------------------------------------------------------------
# 🔮 VISUAL HUD, PURPLE THEME & AUDIO IMMERSION
# ------------------------------------------------------------------------------
hud-and-immersion:
  # Displays an animated countdown BossBar at the top of the screen during authentication.
  bossbar-countdown: true

  # BossBar color (PURPLE, PINK, BLUE, GREEN, RED, YELLOW, WHITE).
  bossbar-color: "PURPLE"

  # Displays real-time prompts above the hotbar (ActionBar) during authentication.
  actionbar-prompt: true

  # Plays sound effects on successful authentication, errors, and countdown ticks.
  play-sounds: true

# ------------------------------------------------------------------------------
# 🔒 PRE-LOGIN RESTRICTIONS (LOCKDOWN ENGINE)
# ------------------------------------------------------------------------------
lockdown:
  # Applies blindness potion effect to unauthenticated players for enhanced visual privacy.
  apply-blindness: true

  # Applies slowness potion effect to immobilize unauthenticated players.
  apply-slowness: true

  # Hides unauthenticated players from the server player list (TAB).
  hide-unauthenticated-from-tab: true

  # Prevents unauthenticated players from moving or rotating their camera.
  prevent-movement: true

  # Blocks global chat messages sent before authentication.
  prevent-chat: true

  # Prevents dropping items from inventory before authentication.
  prevent-item-drop: true

  # Blocks inventory interaction and slot manipulation before authentication.
  prevent-inventory-click: true

  # Protects unauthenticated players from receiving or dealing damage.
  prevent-damage: true

  # Whitelist of commands allowed before completing authentication.
  allowed-commands:
    - "/login"
    - "/l"
    - "/register"
    - "/reg"
    - "/2fa"
    - "/pinpad"
    - "/link"
    - "/tlink"
    - "/email"
    - "/anvil"
    - "/smartlogin"
    - "/sl"
    - "/lang"
    - "/language"
    - "/idioma"

# ------------------------------------------------------------------------------
# 📍 AUTHENTICATION SPAWN & LIMBO
# ------------------------------------------------------------------------------
auth-spawn:
  # Teleports unauthenticated players to a dedicated authentication hub or spawn point.
  enabled: false

  # Target world for the auth spawn.
  world: "world"

  # Coordinates and rotation for the auth spawn point.
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

  # Teleports player back to their original disconnection location upon successful login.
  teleport-back-on-login: true
