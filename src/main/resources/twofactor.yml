# ==============================================================================
# 📱 SmartLogin — Two-Factor Authentication (2FA) & Recovery Suite
# ==============================================================================

# Enable / Disable the entire 2FA subsystem
enabled: true

# TOTP Settings (Google Authenticator, Microsoft Authenticator, Authy, Aegis)
totp:
  issuer-name: "SmartLogin Server"
  code-digits: 6
  period-seconds: 30
  # Allowed time drift steps (1 = +/- 30 seconds tolerance for clock desync)
  time-step-window: 1

# Map QR Code Generation
qr-map:
  enabled: true
  # Give a temporary filled map with the QR code directly into player's main hand
  give-map-item: true

# Single-Use Backup Recovery Codes
recovery-codes:
  enabled: true
  # Number of single-use emergency backup codes generated when setting up 2FA
  code-count: 5
  # Code length
  code-length: 8

# Staff 2FA Enforcement
# Force administrators/moderators to configure 2FA before they can interact with the server
staff-enforcement:
  enabled: true
  # Required permission to enforce 2FA
  permission: "smartlogin.staff"
  # Message sent to unconfigured staff members
  kick-if-not-configured: false
