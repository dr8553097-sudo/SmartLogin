# 🇪🇸 SmartLogin - Idioma Español (MiniMessage & Hex Colors)
prefix: "<gold><bold>SmartLogin</bold></gold> <dark_gray>»</dark_gray> "
prompt-register: "<yellow>Usa <gold>/register <contraseña> <contraseña></gold> para registrarte en el servidor.</yellow>"
prompt-login: "<yellow>Usa <gold>/login <contraseña></gold> para identificarte.</yellow>"
prompt-2fa-verify: "<gold><bold>2FA REQUERIDO:</bold></gold> <yellow>Usa <gold>/2fa verify <código></gold> o <gold>/2fa recovery <código></gold>.</yellow>"
prompt-change-password: "<yellow>Usa <gold>/changepassword <antigua> <nueva></gold>.</yellow>"

title-register: "<gold><bold>REGÍSTRATE</bold></gold>"
subtitle-register: "<yellow>Escribe /register <contraseña> <contraseña></yellow>"
title-login: "<gold><bold>INICIA SESIÓN</bold></gold>"
subtitle-login: "<yellow>Escribe /login <contraseña></yellow>"

success-registered: "<green><bold>✔</bold> ¡Cuenta registrada exitosamente! Bienvenido al servidor.</green>"
success-logged-in: "<green><bold>✔</bold> ¡Has iniciado sesión correctamente! Diviértete.</green>"
success-auto-login-bedrock: "<aqua><bold>✔</bold> ¡Cuenta Bedrock verificada automáticamente mediante Floodgate!</aqua>"
success-auto-login-premium: "<gold><bold>✔</bold> ¡Cuenta Java Premium de Mojang detectada! Inicio de sesión automático.</gold>"
success-session-shield: "<green><bold>✔</bold> ¡Sesión reconocida por SessionShield! Bienvenido de vuelta.</green>"
success-2fa-enabled: "<green><bold>✔</bold> ¡Autenticación 2FA activada con éxito en tu cuenta!</green>"
success-2fa-disabled: "<yellow><bold>✔</bold> Protección 2FA desactivada de tu cuenta.</yellow>"
success-password-changed: "<green><bold>✔</bold> ¡Tu contraseña ha sido actualizada exitosamente!</green>"
success-premium-enabled: "<green><bold>✔</bold> Modo Mojang Premium activado. Entrarás sin pedir contraseña si eres premium.</green>"
success-premium-disabled: "<yellow><bold>✔</bold> Modo Premium desactivado. Deberás ingresar contraseña.</yellow>"

error-already-logged-in: "<red>✘ ¡Ya has iniciado sesión!</red>"
