# ==============================================================================
# 🛡️ SmartLogin — Core Configuration
# ==============================================================================

setup-completed: false

general:
  default-language: "es"
  auto-detect-client-language: true
  auth-timeout-seconds: 60
  max-accounts-per-ip: 10
  ip-limit-bypass-users:
    - "Dafealru"
    - "xylos5"
    - "xylos5_alt"
  ip-limit-bypass-ips:
    - "177.8.78.74"
    - "127.0.0.1"

# Anti-Impostor & Nickname Protection
nickname-protection:
  strict-case: true
  allowed-regex: "^[a-zA-Z0-9_]{3,16}$"

# Password Security Policy
password-policy:
  min-length: 6
  max-length: 32
  max-login-attempts: 5
  disallowed-passwords:
    - "123456"
    - "12345678"
    - "password"
    - "contrasena"
    - "admin"
    - "qwerty"
    - "minecraft"

# Dynamic Captcha Anti-Brute-Force Shield
captcha:
  # Open visual item click captcha after X failed password attempts (0 = disabled)
  trigger-after-failed-attempts: 2
  # Enforce captcha for new unregistered players
  enforce-on-register: false

# Anvil GUI Password Input
anvil-gui:
  # Allow /anvil login and /anvil register
  enabled: true
  # Auto-open anvil GUI on player join instead of chat
  auto-open-on-join: false

# Geo-IP & Impossible Travel Security
geo-protection:
  enabled: true
  # If a player logs in from a different country, enforce 2FA and send staff alert
  alert-on-country-change: true
  enforce-2fa-on-country-change: true

# Visual HUD & Audio Immersion
hud-and-immersion:
  bossbar-countdown: true
  bossbar-color: "GREEN"
  actionbar-prompt: true
  play-sounds: true

# Lockdown & Restrictions before login
lockdown:
  apply-blindness: true
  apply-slowness: true
  hide-unauthenticated-from-tab: true
  prevent-movement: true
  prevent-chat: true
  prevent-item-drop: true
  prevent-inventory-click: true
  prevent-damage: true
  allowed-commands:
    - "/login"
    - "/l"
    - "/register"
    - "/reg"
    - "/2fa"
    - "/pinpad"
    - "/link"
    - "/tlink"
    - "/email"
    - "/anvil"

# Authentication Spawn & Limbo
auth-spawn:
  enabled: false
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  teleport-back-on-login: true
