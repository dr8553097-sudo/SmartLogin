# 🇺🇸 SmartLogin - English Language (Aesthetic Purple Theme & Hex Gradients)
prefix: "<gradient:#9333EA:#C084FC><bold>SmartLogin</bold></gradient> <dark_gray>»</dark_gray> "
prompt-register: "<gray>Please use <light_purple><bold>/register <password> <confirm></bold></light_purple> to register your account.</gray>"
prompt-login: "<gray>Please use <light_purple><bold>/login <password></bold></light_purple> to authenticate.</gray>"
prompt-2fa-verify: "<dark_purple><bold>2FA REQUIRED:</bold></dark_purple> <gray>Use <light_purple>/2fa verify <code></light_purple> or <light_purple>/2fa recovery <code></light_purple>.</gray>"
prompt-change-password: "<gray>Use <light_purple>/changepassword <old> <new></light_purple>.</gray>"

title-register: "<gradient:#9333EA:#C084FC><bold>REGISTER</bold></gradient>"
subtitle-register: "<gray>Type <light_purple>/register <password> <confirm></light_purple></gray>"
title-login: "<gradient:#9333EA:#C084FC><bold>LOGIN</bold></gradient>"
subtitle-login: "<gray>Type <light_purple>/login <password></light_purple></gray>"

success-registered: "<green><bold>✔</bold> Account registered successfully! Welcome to the server.</green>"
success-logged-in: "<green><bold>✔</bold> Successfully logged in! Have fun playing.</green>"
success-auto-login-bedrock: "<aqua><bold>✔</bold> Bedrock account automatically verified via Floodgate!</aqua>"
success-auto-login-premium: "<gold><bold>✔</bold> Genuine Mojang Java Premium detected! Auto-logged in.</gold>"
success-session-shield: "<green><bold>✔</bold> Session recognized by SessionShield! Welcome back.</green>"
success-2fa-enabled: "<green><bold>✔</bold> Two-factor authentication (2FA) enabled successfully!</green>"
success-2fa-disabled: "<yellow><bold>✔</bold> 2FA protection disabled for your account.</yellow>"
success-password-changed: "<green><bold>✔</bold> Your password has been changed successfully!</green>"
success-premium-enabled: "<green><bold>✔</bold> Premium auto-login mode enabled.</green>"
success-premium-disabled: "<yellow><bold>✔</bold> Premium auto-login mode disabled.</yellow>"

error-already-logged-in: "<red>✘ You are already logged in!</red>"
error-already-registered: "<red>✘ This account is already registered! Use /login.</red>"
error-not-registered: "<red>✘ This account is not registered. Use /register.</red>"
error-not-logged-in: "<red>✘ You must log in before doing that.</red>"
error-wrong-password: "<red>✘ Incorrect password. Please try again.</red>"
error-passwords-mismatch: "<red>✘ The entered passwords do not match.</red>"
error-password-length: "<red>✘ Password must be between 6 and 32 characters.</red>"
error-password-too-weak: "<red>✘ That password is too common or weak. Choose a stronger one.</red>"
error-2fa-invalid: "<red>✘ Invalid or expired 2FA code. Check your clock.</red>"
error-2fa-not-setup: "<red>✘ You do not have 2FA configured.</red>"
error-chat-locked: "<red>✘ You must log in or register before chatting.</red>"
error-command-locked: "<red>✘ You cannot execute commands before authenticating.</red>"
error-wrong-old-password: "<red>✘ The old password you entered is incorrect.</red>"
