error-password-too-weak: "<red>✘ Esa contraseña es demasiado débil o común. Elige una más segura.</red>"
error-2fa-invalid: "<red>✘ Código 2FA inválido o expirado. Revisa la hora de tu dispositivo.</red>"
error-2fa-not-setup: "<red>✘ No tienes 2FA configurado en esta cuenta.</red>"
error-chat-locked: "<red>✘ Debes iniciar sesión o registrarte antes de usar el chat.</red>"
