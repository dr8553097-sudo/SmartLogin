# 🇧🇷 SmartLogin - Idioma Português (MiniMessage & Hex Colors)
prefix: "<gold><bold>SmartLogin</bold></gold> <dark_gray>»</dark_gray> "
prompt-register: "<yellow>Use <gold>/register <senha> <confirmar></gold> para registrar-se no servidor.</yellow>"
prompt-login: "<yellow>Use <gold>/login <senha></gold> para autenticar-se.</yellow>"
prompt-2fa-verify: "<gold><bold>2FA NECESSÁRIO:</bold></gold> <yellow>Use <gold>/2fa verify <código></gold> ou <gold>/2fa recovery <código></gold>.</yellow>"
prompt-change-password: "<yellow>Use <gold>/changepassword <antiga> <nova></gold>.</yellow>"

title-register: "<gold><bold>REGISTRE-SE</bold></gold>"
subtitle-register: "<yellow>Digite /register <senha> <confirmar></yellow>"
title-login: "<gold><bold>LOGIN</bold></gold>"
subtitle-login: "<yellow>Digite /login <senha></yellow>"

success-registered: "<green><bold>✔</bold> Conta registrada com sucesso! Bem-vindo ao servidor.</green>"
success-logged-in: "<green><bold>✔</bold> Login efetuado com sucesso! Divirta-se jogando.</green>"
success-auto-login-bedrock: "<aqua><bold>✔</bold> Conta Bedrock verificada automaticamente via Floodgate!</aqua>"
success-auto-login-premium: "<gold><bold>✔</bold> Conta Mojang Java Premium detectada! Login automático.</gold>"
success-session-shield: "<green><bold>✔</bold> Sessão reconhecida pelo SessionShield! Bem-vindo de volta.</green>"
success-2fa-enabled: "<green><bold>✔</bold> Autenticação 2FA ativada com sucesso!</green>"
success-2fa-disabled: "<yellow><bold>✔</bold> Proteção 2FA desativada da sua conta.</yellow>"
success-password-changed: "<green><bold>✔</bold> Sua senha foi alterada com sucesso!</green>"
success-premium-enabled: "<green><bold>✔</bold> Modo Premium ativado.</green>"
success-premium-disabled: "<yellow><bold>✔</bold> Modo Premium desativado.</yellow>"

