enabled: false

smtp:
  host: "smtp.gmail.com"
  port: 587
  starttls: true
  username: "your-server-email@gmail.com"
  password: "your-app-password"
  from: "SmartLogin Security <your-server-email@gmail.com>"

recovery:
  code-length: 6
  code-expiry-minutes: 15
