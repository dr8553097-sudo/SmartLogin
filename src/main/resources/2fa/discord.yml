# ==============================================================================
# 🤖 SmartLogin — 2FA: Discord Bot & Security Webhooks
# ==============================================================================

enabled: false
bot-token: "YOUR_DISCORD_BOT_TOKEN_HERE"

bot:
  enabled: false
  token: "YOUR_DISCORD_BOT_TOKEN_HERE"
  guild-id: ""
  verified-role-id: ""

# Discord 2FA Approval by Direct Message (DM)
dm-2fa-approval:
  enabled: true
  only-on-new-ip: true
  approval-timeout-seconds: 60

# Staff & Security Webhooks
webhooks:
  enabled: false
  staff-security-logs-url: ""
  notify-on-admin-login: true
  notify-on-brute-force-fail: true
  notify-on-2fa-change: true
  notify-on-password-change: true
